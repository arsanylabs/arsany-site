<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1584px;height:396px;overflow:hidden}
body{font-family:Figtree,Arial,sans-serif;color:#fff;position:relative;
  background:
    radial-gradient(700px 420px at 78% 40%, rgba(63,224,138,.20), transparent 70%),
    radial-gradient(520px 380px at 40% 120%, rgba(245,165,18,.10), transparent 70%),
    linear-gradient(120deg,#06100b 0%,#0a1f15 45%,#0c2a1c 70%,#07130d 100%);}
.eq{position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;align-items:flex-end;gap:6px;padding:0 0 0 0;opacity:.13}
.eq i{flex:1;background:#3fe08a;border-radius:3px 3px 0 0}
.grain{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
.copy{position:absolute;left:470px;top:50px;width:560px}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 15px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#3fe08a;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;background:#3fe08a;box-shadow:0 0 0 6px rgba(63,224,138,.18)}
h1{margin:14px 0 6px;font-weight:900;font-size:58px;line-height:.98;letter-spacing:-2px}
h1 span{color:#3fe08a}
.sub{font-size:22px;color:#b9cdc1;font-weight:500;margin:0}
.np{position:absolute;left:470px;top:262px;width:560px;display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(4px)}
.np .art{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#f5a512,#5c3a06);display:grid;place-items:center;flex:none;overflow:hidden}
.np .art img{width:40px;height:40px;object-fit:contain;border-radius:8px}.np .art.code{background:linear-gradient(135deg,#3fe08a,#0b5a32);color:#06140c;font:800 20px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:-1px}
.np .t{flex:1;min-width:0}
.np strong{display:block;font-size:17px;font-weight:700;white-space:nowrap}
.np em{display:block;font-style:normal;font-size:14px;color:#9fb6a8;margin-top:2px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:9px;position:relative}
.bar b{position:absolute;left:0;top:0;bottom:0;width:62%;background:#3fe08a;border-radius:2px}
.bar b::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#fff}
.play{width:44px;height:44px;border-radius:50%;background:#3fe08a;display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px;fill:#04150c}
.covers{position:absolute;right:70px;top:50%;transform:translateY(-52%);width:470px;height:300px}
.c{position:absolute;width:190px;height:190px;border-radius:12px;box-shadow:0 22px 50px rgba(0,0,0,.55);display:grid;place-items:center;overflow:hidden}
.c::before{content:"";position:absolute;inset:0;background:var(--pat,none)}
.c img{position:relative;max-width:62%;max-height:62%}
.c img.tile{width:58%;height:58%;max-width:none;max-height:none;border-radius:18%;}
.c .lbl{position:absolute;left:12px;bottom:10px;font-size:13px;font-weight:800;letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.c1{left:0;top:62px;background:linear-gradient(135deg,#4a4044,#1f1a17);--pat:repeating-radial-gradient(circle at 28% 118%,transparent 0 14px,rgba(0,0,0,.18) 14px 16px);transform:rotate(-8deg);z-index:1}
.c2{left:140px;top:10px;background:linear-gradient(135deg,#f5a512,#5c3a06);transform:rotate(-1deg);z-index:3;width:210px;height:210px}
.c3{left:290px;top:70px;background:linear-gradient(135deg,#ffc00a,#7a4a00);--pat:repeating-linear-gradient(-45deg,transparent 0 18px,rgba(255,255,255,.1) 18px 20px);transform:rotate(7deg);z-index:2}
.feat{position:absolute;right:16px;top:14px;display:flex;gap:6px;z-index:2}
.feat span{font-size:11px;font-weight:800;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:99px}
</style></head><body>
<div class="eq" id="eq"></div><div class="grain"></div>

<div class="copy">
  <div class="eyebrow"><span class="dot"></span>Senior Fullstack Engineer · On tour now</div>
  <h1>Building products end&nbsp;to&nbsp;end<span>.</span></h1>
  <p class="sub">From the database to the demo.</p>
</div>

<div class="np">
  <div class="art code">&lt;/&gt;</div>
  <div class="t">
    <strong>TypeScript · NestJS · React</strong>
    <em>Postgres · Retool · AWS</em>
    <div class="bar"><b></b></div>
  </div>
  <div class="play"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></div>
</div>

<div class="covers">
  <div class="c c1"><img class="tile" src="../public/logos/dentica.png" alt=""><span class="lbl">Dentica</span></div>
  <div class="c c2"><div class="feat"><span>feat. Wayve</span></div><img class="tile" src="../public/logos/stackdrop.png" alt=""><span class="lbl">Arsany × Stackdrop</span></div>
  <div class="c c3"><img class="tile" src="../public/logos/marathon-navigator.svg" alt=""><span class="lbl">Marathon Navigator</span></div>
</div>

<script>
var eq=document.getElementById('eq'),h='';
for(var i=0;i<120;i++){var v=18+Math.abs(Math.sin(i*0.37)*60+Math.sin(i*1.3)*25+Math.cos(i*0.11)*20);h+='<i style="height:'+v.toFixed(0)+'px"></i>';}
eq.innerHTML=h;
</script>
</body></html>
